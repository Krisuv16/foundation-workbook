<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E53E51">
<title>Foundations Journey — IESP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, encouraging, playful-but-respectful — a journey you walk, not a form you fill.
   IDEA: a trail map of the workshop; every activity is a stop, every answer earns XP and badges.
   PICTURE: winding brand-coloured journey path on Home; badge shelf; one-page action plan.
   COLOUR and TYPE: IESP coral #E53E51, green #61A60E, pinks + mint; Montserrat only.
   LAYOUT: mobile-first app shell (top status, content, bottom tab bar); centred 620px column on laptop. */
:root{color-scheme:light;--coral:#E53E51;--coral-d:#C5303E;--green:#61A60E;--green-d:#3E7A06;--pink:#FFECEB;--pink2:#FEB7B5;--mint:#F6F9F2;--card:#DFECD2;--ink:#141414;--text:#2E2E2E;--muted:#5E5E5E;--line:#E7DEDE;--w:#fff;--r:20px;--shd:0 2px 8px rgba(20,20,20,.06),0 12px 30px rgba(20,20,20,.07)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}html{background:#F6F9F2}[hidden]{display:none!important}
body{background:var(--mint);color:var(--text);font:16px/1.5 Montserrat,'Helvetica Neue',Arial,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{max-width:620px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--mint)}
@media(min-width:700px){body{background:linear-gradient(135deg,#FFECEB 0%,#F6F9F2 60%,#DFECD2 100%)}.app{box-shadow:0 0 60px rgba(20,20,20,.08)}}
/* status bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:21px;background:var(--coral);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.lvl{flex:1}.lvl b{display:block;font-size:14px;color:var(--ink);line-height:1.2}.lvl small{font-size:12px;color:var(--muted);font-weight:600}
.xpbar{height:8px;background:var(--pink);border-radius:8px;overflow:hidden;margin-top:5px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8CCB3A);width:0;transition:width .5s}
.pill{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--ink);background:var(--pink);border-radius:20px;padding:6px 10px;flex:none}
.pill svg{width:16px;height:16px}
/* main + tabbar */
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;z-index:30;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:14px;min-height:54px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--coral);background:var(--pink)}
.hidetabs .tabs{display:none}.hidetabs main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
/* generic */
h1,h2,h3{color:var(--ink);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:800;color:var(--coral)}h2{font-size:22px;font-weight:800}h3{font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.card{background:var(--w);border-radius:var(--r);padding:18px;box-shadow:var(--shd)}
.stack>*+*{margin-top:14px}
.btn{border:0;border-radius:30px;min-height:52px;padding:0 22px;font-weight:800;font-size:16px;cursor:pointer;background:var(--coral);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.block{width:100%}
.btn:disabled{opacity:.45}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-d)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--coral);color:#fff;padding:22px 20px 20px}
.hero h1{color:#fff;font-size:24px}@media(max-width:360px){.hero h1{font-size:21px}.hero .eyebrow{font-size:11px}.ring{width:64px;height:64px}.ring svg{width:64px;height:64px}.ring b{font-size:17px}}.hero .go{font-size:16px;min-height:60px;padding:8px 22px;text-align:left;justify-content:space-between}.hero .go span{display:block;line-height:1.2}.hero .go small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.hero p{margin:6px 0 0;font-size:15px;opacity:.95}
.hero .blob{position:absolute;right:-40px;top:-40px;width:170px;height:170px;opacity:.35}
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{width:76px;height:76px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(255,255,255,.18);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:11px;font-weight:700;opacity:.9}
/* journey map */
.part{position:relative;z-index:1;flex-wrap:wrap;row-gap:6px;display:flex;align-items:center;gap:10px;margin:22px 0 4px}.part span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);background:var(--card);border-radius:20px;padding:5px 12px}.part i{flex:1;height:2px;background:var(--card)}
.trail{position:relative}
.stop{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.stop.r{flex-direction:row-reverse;text-align:right}
.node{position:relative;width:74px;height:74px;flex:none;border-radius:37px;background:none;display:grid;place-items:center;font-weight:800;font-size:24px;color:var(--ink);transition:transform .2s;filter:drop-shadow(0 4px 8px rgba(20,20,20,.12))}.node>.bead{position:absolute;inset:0;width:74px;height:74px}.node>*:not(.bead){position:relative}
.stop:active .node{transform:scale(.94)}
.node.part{color:var(--coral-d)}
.node.done{color:#fff}
.node.next{animation:pulse 1.8s infinite;border-radius:37px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,81,.45)}50%{box-shadow:0 0 0 10px rgba(229,62,81,0)}}
.node svg{width:32px;height:32px}
.sinfo{flex:1;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shd)}
.sinfo b{display:block;color:var(--ink);font-size:16px;line-height:1.25}.sinfo small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.stars{display:flex;gap:2px;margin-top:6px}.stop.r .stars{justify-content:flex-end}.stars svg{width:16px;height:16px}
.season{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:12px;font-weight:700;color:var(--coral-d);background:var(--pink);border-radius:20px;padding:5px 10px}.season svg{width:14px;height:14px}.trailnote{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shd);margin-top:14px;font-size:14px;color:var(--text)}.trailnote svg{flex:none;width:34px;height:34px}.booth{background:linear-gradient(#FFF6F5,#fff);border-radius:var(--r);padding:12px 12px 16px;box-shadow:var(--shd)}.booth svg{display:block;width:100%;height:auto}.booth .bm{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 6px 0}.booth .bm b{color:var(--ink);font-size:15px}.booth .bm span{font-size:13px;font-weight:700;color:var(--green-d);background:var(--card);border-radius:20px;padding:4px 10px;white-space:nowrap}.booth p{margin:6px 6px 0;font-size:13px;color:var(--muted)}
.path{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* activity */
.abar{position:sticky;top:0;z-index:25;background:rgba(246,249,242,.97);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.ib svg{width:20px;height:20px}
.atitle{flex:1;min-width:0}.atitle b,.atitle small{display:block}.atitle small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:360px){.abar .pill{display:none}}.atitle b{font-size:15px;color:var(--ink);line-height:1.2}.atitle small{font-size:12px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:4px;padding:0 16px 8px}.dots i{flex:1;height:6px;border-radius:6px;background:var(--line)}.dots i.d{background:var(--green)}.dots i.c{background:var(--coral)}
.step{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{font-size:21px;font-weight:800;color:var(--ink);line-height:1.25;margin:0}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.slide{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-d);background:var(--card);border-radius:20px;padding:5px 10px;margin-bottom:12px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;font-size:16px;border:2px solid var(--line);border-radius:16px;padding:14px;background:#FFFCFC;color:var(--ink);min-height:52px}
textarea{min-height:150px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(97,166,14,.15)}
label.f{display:block;font-weight:700;font-size:15px;color:var(--ink);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--green);background:#fff;font-weight:700;font-size:15px;border-radius:30px;padding:10px 16px;min-height:46px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}
.opt b{display:block;font-size:16px;color:var(--ink)}.opt small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt .rad{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none}
.opt[aria-pressed=true]{border-color:var(--coral);background:var(--pink)}.opt[aria-pressed=true] .rad{border:7px solid var(--coral)}
.opt.right{border-color:var(--green);background:#F0F8E6}.opt.wrong{border-color:var(--coral);background:var(--pink)}
.cl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.cl label{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 14px;cursor:pointer;min-height:52px}
.cl input{width:24px;height:24px;accent-color:var(--green);flex:none;margin:0}
.cl label:has(input:checked){border-color:var(--green);background:#F0F8E6}
.info p{margin:0 0 12px}.info p:last-child{margin:0}
.quote{border-left:5px solid var(--coral);padding:4px 0 4px 14px;font-weight:600;color:var(--ink)}
.out{background:var(--card);border-radius:16px;padding:14px;margin-top:14px;font-weight:600;color:var(--ink)}.out .ph{color:var(--muted);font-weight:500}
.money{position:relative}.money input{padding-left:32px}.money:before{content:'$';position:absolute;left:14px;top:14px;font-weight:800;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.g2 label.f{margin-top:6px}
.big{font-size:28px;font-weight:800;line-height:1.1}.pos{color:var(--green-d)}.neg{color:var(--coral-d)}
.feedback{margin-top:14px;border-radius:16px;padding:14px;font-weight:600}.feedback.ok{background:#F0F8E6;color:var(--green-d)}.feedback.no{background:var(--pink);color:var(--coral-d)}
.anav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;z-index:30;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.anav .btn{flex:1}.anav .btn.o{flex:0 0 auto;width:96px}
.tool{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tb{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px;display:inline-flex;gap:6px;align-items:center}
.tb[aria-pressed=true]{background:var(--coral);color:#fff;border-color:var(--coral)}
.xpf{position:fixed;left:50%;top:auto;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,0);font-weight:800;font-size:22px;color:var(--green-d);background:#fff;border-radius:30px;padding:8px 16px;box-shadow:var(--shd);z-index:70;pointer-events:none;animation:float 1.1s ease forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:400px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}.badge small{overflow-wrap:break-word}
.badge{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--shd)}
.badge .bi{width:64px;height:64px;margin:0 auto 8px;border-radius:32px;display:grid;place-items:center;background:var(--line)}
.badge .bi svg{width:32px;height:32px;color:#fff}
.badge b{display:block;font-size:13px;color:var(--ink);line-height:1.2}.badge small{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.badge.on .bi{background:var(--coral)}.badge.on.gold .bi{background:var(--green)}
.badge:not(.on){opacity:.6}
/* plan */
.plan dl{margin:0;display:grid;gap:12px}.plan dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d)}.plan dd{margin:2px 0 0;font-weight:600;color:var(--ink);white-space:pre-wrap}.plan dd.ph{color:var(--muted);font-weight:500}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:28px 28px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .35s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .bi{width:96px;height:96px;border-radius:48px;margin:0 auto 12px;display:grid;place-items:center;background:var(--coral)}.sheet .bi svg{width:48px;height:48px;color:#fff}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
/* settings */
.seg{display:flex;gap:8px}.seg button{flex:1}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}
.sw{width:52px;height:30px;border-radius:16px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}.sw:before{content:'';position:absolute;inset:-8px -4px}.sw:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]:after{left:25px}
.brandbar{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:20px;padding:6px 16px;box-shadow:var(--shd);margin-bottom:14px}.brandbar img{display:block;height:84px;width:auto;max-width:100%}.brandfoot{display:block;width:min(240px,70%);height:auto;margin:22px auto 0}
.cover-logo{display:block;width:min(260px,70%);height:auto;margin:14px auto 0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
/* a11y modes */
html.t1 body{font-size:18px}html.t1 .q{font-size:24px}html.t1 textarea,html.t1 input{font-size:18px}
html.t2 body{font-size:20px}html.t2 .q{font-size:27px}html.t2 textarea,html.t2 input{font-size:20px}html.t2 .hint,html.t2 .sub{font-size:17px}
html.hc{--muted:#222;--line:#555}html.hc .card,html.hc .sinfo{box-shadow:none;border:2px solid #141414}
html.er body{letter-spacing:.03em;word-spacing:.12em;line-height:1.8}
html.rm *,html.rm *:before,html.rm *:after{animation:none!important;transition:none!important}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-weight:700;font-size:14px;z-index:95;display:none}.toast.on{display:block}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top" id="top"></header>
<main id="main"><div class="card" style="margin-top:24px;text-align:center"><p class="eyebrow">Indigenous Entrepreneurial Foundations</p><h1 style="margin:8px 0 10px">Your Foundations Journey</h1><p>This workbook is interactive, so it needs to open in a web browser.</p><p style="margin-top:12px"><a class="btn block" href="https://claude.ai/artifact/KmFnWBYDFUPodRBzjSyJ25">Open the workbook</a></p><p class="sub" style="margin-top:12px">Or type this address into Safari or Chrome:<br><b style="word-break:break-all">claude.ai/artifact/KmFnWBYDFUPodRBzjSyJ25</b></p></div></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<canvas id="cf" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

 <div style="padding:4px 0 0">${stepHTML(a,st)}</div>
 <div class="anav"><button class="btn o" data-act="prev" ${R.s===0?'disabled':''} aria-label="Previous step">${ic('back','style="width:20px;height:20px"')}</button><button class="btn ${R.s===s.length-1?'g':''}" data-act="next">${R.s===s.length-1?'Finish stop':(done(st)||st.opt?'Next':'Skip for now')}</button></div>`}
function finishAct(){const a=ACTS[R.a];const s=stars(a);R={v:'home',a:0,s:0};go('home');if(qBadge.length)setTimeout(showNext,250);else if(s<3)toast(`${s} of 3 stars — come back anytime to finish`)}
// ---------- ROUTER ----------
function go(v,push=true){if(v==='act'){}else R.v=v;render();if(push){try{history.replaceState(null,'','#'+(R.v==='act'?'act-'+ACTS[R.a].id:R.v))}catch(e){}}window.scrollTo(0,0)}
function render(){document.documentElement.classList.toggle('t1',P.size===1);document.documentElement.classList.toggle('t2',P.size===2);['hc','er','rm'].forEach(k=>document.documentElement.classList.toggle(k,!!P[k]));
 $('#app').classList.toggle('hidetabs',R.v==='act');renderTop();renderTabs();
 $('#main').innerHTML=R.v==='home'?viewHome():R.v==='badges'?viewBadges():R.v==='plan'?viewPlan():R.v==='me'?viewMe():viewAct();
 if(R.v==='act'){derive();const f=$('#main textarea,#main input');if(f&&!('ontouchstart' in window))f.focus({preventScroll:true})}
 if(R.v==='plan')lightDL();if(R.v==='me'&&dbRef)$('#syncNote').textContent='Synced to your account — open it on any device.';drawTrail()}
function drawTrail(){const t=$('#trail');if(!t)return;const nodes=[...t.querySelectorAll('.node')];if(nodes.length<2)return;const tr=t.getBoundingClientRect();let d='';nodes.forEach((n,i)=>{const r=n.getBoundingClientRect();const x=r.left-tr.left+r.width/2,y=r.top-tr.top+r.height/2;if(!i)d+=`M${x} ${y}`;else{const p=nodes[i-1].getBoundingClientRect();const px=p.left-tr.left+p.width/2,py=p.top-tr.top+p.height/2;const my=(py+y)/2;d+=` C${px} ${my} ${x} ${my} ${x} ${y}`}});t.insertAdjacentHTML('afterbegin',`<svg class="path" aria-hidden="true"><path d="${d}" fill="none" stroke="none"/></svg>`);const sv=t.querySelector('.path'),pa=sv.querySelector('path');let L=0;try{L=pa.getTotalLength()}catch(e){}const cols=['#E53E51','#FEB7B5','#61A60E','#FEB7B5'];let c='';for(let l=6,i=0;l<L;l+=15,i++){const q=pa.getPointAtLength(l);c+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.4" fill="${cols[i%4]}"/>`}sv.insertAdjacentHTML('beforeend',c)}
addEventListener('resize',()=>{const p=document.querySelector('.path');if(p){p.remove();drawTrail()}});
function fromHash(){const h=(location.hash||'').slice(1);if(h.startsWith('act-')){const i=ACTS.findIndex(a=>a.id===h.slice(4));if(i>=0&&ACTS[i].steps){R={v:'act',a:i,s:firstOpen(i)};return}}if(['home','badges','plan','me'].includes(h))R.v=h}
function firstOpen(i){const s=actSteps(ACTS[i]);const j=s.findIndex(x=>!done(x));return j<0?0:j}
addEventListener('hashchange',()=>{fromHash();render();if(R.v!=='act'&&qBadge.length&&!$('#modal').classList.contains('on'))setTimeout(showNext,250)});
// ---------- EVENTS ----------
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;D[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;derive();clearTimeout(window._ct);window._ct=setTimeout(()=>{changed();const n=$('.anav .btn:last-child');if(n&&R.v==='act'){const st=actSteps(ACTS[R.a])[R.s];if(R.s<actSteps(ACTS[R.a]).length-1)n.textContent=done(st)||st.opt?'Next':'Skip for now';$('.dots').innerHTML=actSteps(ACTS[R.a]).map((x,i)=>`<i class="${done(x)?'d':i===R.s?'c':''}"></i>`).join('')}},e.target.type==='checkbox'||e.target.tagName==='SELECT'?0:700)});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='date'){const k=e.target.dataset.k;if(k){D[k]=e.target.value;derive();changed()}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-go]');if(!t)return;
 if(t.dataset.go){R.v=t.dataset.go;go(t.dataset.go);if(qBadge.length&&!$('#modal').classList.contains('on'))setTimeout(showNext,250);return}
 if(t.dataset.open!=null){const i=+t.dataset.open;R={v:'act',a:i,s:firstOpen(i)};go('act');return}
 const c=t.closest('[data-many]');if(c&&t.classList.contains('chip')){const g=c.dataset.many,max=+c.dataset.max;let a=D[g]||[];if(a.includes(t.dataset.v))a=a.filter(x=>x!==t.dataset.v);else{if(a.length>=max){toast(`Choose up to ${max}`);return}a=[...a,t.dataset.v]}D[g]=a;t.setAttribute('aria-pressed',a.includes(t.dataset.v));changed();refreshNav();return}
 const o=t.closest('[data-one]');if(o&&t.classList.contains('opt')){const g=o.dataset.one;D[g]=t.dataset.v;o.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===D[g]));changed();refreshNav();return}
 const q=t.closest('[data-quiz]');if(q&&t.classList.contains('opt')&&!t.disabled){D[q.dataset.quiz]=+t.dataset.i;changed();$('#main').innerHTML=viewAct();return}
 const act=t.dataset.act;
 if(act==='next'){const s=actSteps(ACTS[R.a]);if(R.s<s.length-1){R.s++;go('act')}else finishAct();return}
 if(act==='prev'){if(R.s>0){R.s--;go('act')}return}
 if(act==='closeModal'){$('#modal').classList.remove('on');setTimeout(showNext,250);return}
 if(act==='copyPlan'||act==='copyAll'){const txt=act==='copyPlan'?planText():allText();try{await navigator.clipboard.writeText(txt);toast('Copied — paste it anywhere')}catch(err){const n=$('#copyNote');n.innerHTML='Copying isn’t available here — select the text below.<textarea readonly style="margin-top:8px;min-height:200px"></textarea>';n.querySelector('textarea').value=txt;n.querySelector('textarea').select()}return}
 if(act==='dl'){dlFile();return}
 if(act==='clear'){$('#sheet').innerHTML=`<h2>Clear your workbook?</h2><p class="sub" style="font-size:15px">This removes every answer, badge and XP on this device and in your account. It can’t be undone.</p><div style="display:flex;gap:10px;margin-top:18px"><button class="btn o" style="flex:1" data-act="closeModal">Keep it</button><button class="btn" style="flex:1" data-act="doClear">Clear</button></div>`;$('#modal').classList.add('on');return}
 if(act==='doClear'){D={};M.seen=[];saveMeta();persist();lastXP=0;lastLvl=0;$('#modal').classList.remove('on');go('home');toast('Workbook cleared');return}
 if(t.dataset.size!=null){P.size=+t.dataset.size;saveP();render();return}
 if(t.dataset.opt){P[t.dataset.opt]=!P[t.dataset.opt];saveP();render();return}
 if(act==='say'&&tts){const st=actSteps(ACTS[R.a])[R.s];const body=document.createElement('div');body.innerHTML=st.body||'';const txt=[st.q,st.hint,body.textContent,(st.opts||[]).map(x=>Array.isArray(x)?x[0]:x).join(', '),(st.items||[]).join('. ')].filter(Boolean).join('. ');tts.speak(txt.slice(0,1990),{language:'en'}).catch(()=>{});return}
 if(act==='mic'&&dict){micToggle(t);return}
});
function refreshNav(){const n=$('.anav .btn:last-child');if(!n)return;const s=actSteps(ACTS[R.a]);const st=s[R.s];if(R.s<s.length-1)n.textContent=done(st)||st.opt?'Next':'Skip for now';$('.dots').innerHTML=s.map((x,i)=>`<i class="${done(x)?'d':i===R.s?'c':''}"></i>`).join('')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on')){$('#modal').classList.remove('on');setTimeout(showNext,250)}});
function saveP(){try{localStorage.setItem(KEY+'-a11y',JSON.stringify(P))}catch(e){}}
function planText(){return 'MY ACTION PLAN — Indigenous Entrepreneurial Foundations\n'+(D.name?D.name+'\n':'')+PLAN.map(([l,f])=>{const v=(f()||'').toString().trim();return v?`\n${l}:\n${v}`:''}).join('')}
function allText(){const out=['MY FOUNDATIONS WORKBOOK',D.name||'',D.nation||''];ACTS.forEach(a=>{if(!a.steps)return;out.push('\n== '+(a.n>0?'Activity '+a.n+': ':'')+a.title+' ==');a.steps.forEach(st=>{if(st.t==='info')return;if(st.t==='quiz'){if(D[st.k]!=null&&D[st.k]!=='')out.push(st.q+' → '+st.opts[D[st.k]]);return}if(st.t==='check'){const ks=stepKeys(st);const c=st.items.filter((_,i)=>D[ks[i]]);if(c.length)out.push(st.q+':\n- '+c.join('\n- '));return}if(st.keys&&st.t!=='check'){st.keys.forEach(([k,l])=>{if(val(k))out.push(l+': '+D[k])});return}if(st.t==='ps'){const p=PLAN[4][1]();if(p)out.push('Positioning: '+p);return}if(st.t==='budget'){const b=budgetLine();if(b)out.push('Budget: '+b);return}const v=D[st.k];if(Array.isArray(v)?v.length:v)out.push(st.q+'\n'+(Array.isArray(v)?v.join(', '):v))})});out.push('\n'+planText());return out.join('\n')}
// ---------- CAPABILITIES ----------
let tts=null,dict=null,hasTTS=false,hasDict=false,dlNS=null,micBtn=null,micBase='';
function lightDL(){const b=$('#dlBtn');if(b&&dlNS)b.hidden=false}
async function dlFile(){if(!dlNS)return;const body=esc(allText()).replace(/\n== (.*?) ==/g,'</p><h2>$1</h2><p>').replace(/\n/g,'<br>');const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Foundations Workbook</title><style>body{font:16px/1.6 Montserrat,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#2E2E2E}h1,h2{color:#E53E51}h2{font-size:19px;text-transform:uppercase;border-top:2px solid #FEB7B5;padding-top:14px}</style></head><body><img src="${LOGO}" alt="Futurpreneur, in collaboration with RBC Origins" style="height:60px;width:auto"><h1>My Foundations Workbook</h1><p>${body}</p></body></html>`;try{await dlNS.save({filename:'my-foundations-workbook.html',data:html});toast('Download ready')}catch(e){toast('Download cancelled')}}
function micToggle(b){if(micBtn===b){dict.stop().catch(()=>{});return}const ta=document.querySelector(`[data-k="${b.dataset.mk}"]`);micBtn=b;micBase=ta.value?ta.value.replace(/\s*$/,' '):'';b.setAttribute('aria-pressed','true');b.lastChild.textContent='Listening — tap to stop';dict.start().catch(err=>{b.setAttribute('aria-pressed','false');b.lastChild.textContent='Speak';micBtn=null;if(err&&err.code==='not_granted'){hasDict=false;render()}})}
(async()=>{try{if(!window.claude||!claude.use)return;
 claude.use('downloads').then(d=>{if(d){dlNS=d;lightDL()}}).catch(()=>{});
 claude.use('tts').then(t=>{if(t){tts=t;hasTTS=true;if(R.v==='act')render()}}).catch(()=>{});
 claude.use('dictation').then(d=>{if(!d)return;dict=d;hasDict=true;
  d.onPartial(({text})=>{if(micBtn){const ta=document.querySelector(`[data-k="${micBtn.dataset.mk}"]`);if(ta)ta.value=micBase+text}});
  d.onFinal(({text})=>{if(micBtn){const ta=document.querySelector(`[data-k="${micBtn.dataset.mk}"]`);if(ta){micBase+=text+' ';ta.value=micBase;ta.dispatchEvent(new Event('input',{bubbles:true}))}}});
  d.onState(({state})=>{if(state!=='listening'&&micBtn){micBtn.setAttribute('aria-pressed','false');micBtn.lastChild.textContent='Speak';micBtn=null}});
  if(R.v==='act')render()}).catch(()=>{});
 const user=await claude.use('user');const db=await claude.use('db');const id=user&&await user.id();if(!db||!id)return;
 dbRef=db.doc('data/users/'+id+'/workbook');const snap=await dbRef.get();if(snap.exists){let r={};try{r=JSON.parse(snap.data().answers||'{}')}catch(e){}if(Object.keys(r).length){D=Object.assign({},r,D);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}lastXP=totalXP();lastLvl=level(lastXP).i;M.seen=badges().filter(b=>b.on).map(b=>b.id);saveMeta();render()}}
 if(R.v==='me')render()}catch(e){dbRef=null}})();
// first run: silently mark badges already earned (returning users from v1)
if(!M.init){M.seen=badges().filter(b=>b.on).map(b=>b.id);M.init=1;saveMeta()}
fromHash();render();
}
</script>
